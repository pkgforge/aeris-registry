# AM, driven as a command. AM writes for a person rather than for a program,
# so every operation here is read with a pattern instead of a field map.
#
# This describes AppMan, the per-user half of AM. The system-wide `am` takes
# the same arguments, so pointing detect.command at it is the only change.
schema_version = 1
id = "am"
name = "AppMan"
version = "10.3.4"
description = "AppImages and portable programs from AM's database"

# AM colours its output when a terminal is watching.
strip_ansi = true

# AM reports trouble in words and still exits as though all was well, so an
# install of something it does not have would otherwise read as a success.
# Every one of its errors carries this mark.
failure_pattern = "\U0001F480"

# AM ships one binary per scope: `appman` for the person running it and `am`
# for everyone. `am` refuses to be run under sudo and elevates itself where
# it has to, so it is run as the person who started aeris.
#
# That means anything needing root cannot be answered from a window, and
# installing system wide fails where a password is wanted. Reading works.
[system]
command = "am"
elevate = false

[detect]
command = "appman"
version = ["-v"]
min_version = "10"

# Both listings are the same shape: a diamond, the name, then the description.
[ops.list]
args = ["-l"]
output = { format = "lines" }
pattern = "^\\s*◆\\s+(?P<name>\\S+)\\s*:\\s*(?P<description>.*?)\\s*$"
fields = { name = "name", description = "description" }

[ops.search]
args = ["-q", "{query}"]
output = { format = "lines" }
pattern = "^\\s*◆\\s+(?P<name>\\S+)\\s*:\\s*(?P<description>.*?)\\s*$"
fields = { name = "name", description = "description" }

# The installed listing is a table whose rows AM marks with a bullet. The
# bullet is written with bash's `$"..."` translation syntax, so it survives as
# a diamond on a terminal and as escape text anywhere else; matching it is not
# worth it. The header and its rule are the only rows starting with `-`, which
# is what separates them from a package here. A name carrying `**` is one AM
# considers archived or stale, kept out of the name itself. A package from a
# database other than the main one carries that database in a column of its
# own, which is why the one before the version is optional.
[ops.list_installed]
args = ["-f"]
output = { format = "lines" }
pattern = "^\\s*[^-\\s]\\S*\\s+(?P<name>[^\\s*|]+)\\**\\s*\\|(?:\\s*(?P<repo>[^|]+?)\\s*\\|)?\\s*(?P<version>[^|]+?)\\s*\\|\\s*(?P<pkg_type>[^|]+?)\\s*\\|\\s*(?P<size>[^|]+?)\\s*$"
fields = { name = "name", version = "version", pkg_type = "pkg_type", size = "size", repo = "repo" }

# AM has no machine-readable progress, so these report the stage they are at
# and nothing finer.
# Some AM scripts stop to ask which build to install. Without a terminal the
# question is never even printed and the script fails on the empty answer, so
# these run on one and the question is put to whoever asked for the install.
[ops.install]
needs_terminal = true
args = ["-i", "{selector}"]
output = { format = "lines" }

# `-R` rather than `-r`: the asking form would sit waiting for an answer that
# a window cannot give it.
[ops.remove]
args = ["-R", "{selector}"]
output = { format = "lines" }

[ops.update]
args = ["-u"]
output = { format = "lines" }
