# The adapters aeris offers to add.
#
# An adapter is a manifest and nothing else: it names the arguments to run for
# each operation and how to read what comes back. Aeris fetches the manifest,
# checks it against the checksum here, reads it, and keeps it only if the id
# inside matches the id below.
#
# The checksum is over the manifest file exactly as served. Change a manifest
# and the checksum here has to change with it.
#
# A version here is the manifest's own revision, counting from 1, and has
# nothing to do with the version of the manager it describes. A manager
# updates itself on its own schedule; the manifest changes when someone
# changes it.
[registry]
version = 1
updated = "2026-10-26"

[[plugins]]
id = "am"
name = "AppMan"
version = "1"
description = "AppImages and portable programs from AM's database"
manifest_url = "https://raw.githubusercontent.com/pkgforge/aeris-registry/main/adapters/am.toml"
manifest_checksum_sha256 = "7cd2e8f03a9750ee428832820127eaa92efb2318aee021ca72edb002758f4160"
repo_url = "https://github.com/ivan-hc/AM"

[[plugins]]
id = "flatpak"
name = "Flatpak"
version = "1"
description = "Sandboxed desktop applications via Flatpak"
manifest_url = "https://raw.githubusercontent.com/pkgforge/aeris-registry/main/adapters/flatpak.toml"
manifest_checksum_sha256 = "82d05353a88c6ca9b3a7c5e95e80ab4057b53a4a22339d203dbec81dd6b1fe61"
repo_url = "https://github.com/flatpak/flatpak"

[[plugins]]
id = "pacstall"
name = "Pacstall"
version = "1"
description = "An AUR inspired package manager for Ubuntu"
manifest_url = "https://raw.githubusercontent.com/pkgforge/aeris-registry/main/adapters/pacstall.toml"
manifest_checksum_sha256 = "f525891a879f70518cf698040f266683277fe7f4c0f330b835e0f11fb40d91a7"
repo_url = "https://github.com/pacstall/pacstall"
